# .dsh/folder-path-rules/md.yaml —— markdown 文件的分类规范（由 dsh-file-enhance 读取）
#
# 这份文件是**唯一权威**：插件不内置任何生效中的规则，agent 创建文件时也只按它判定。
# 改完即生效（插件按 mtime 热重载），不需要重启。
#
# 本文件由插件冷启动垫片自动生成——直接按你的项目改：增删分类、改 dest 模板、调关键词。
#
# 字段说明：
#   root        该类型文件的主目录（md → docs）
#   root_allow  根目录白名单（追加在内置默认 README/CHANGELOG/CLAUDE/AGENTS… 之上）
#   categories  分类表：
#                folder    = root 下的目录名
#                keywords  = 用于把「文件主题词/描述」归位
#                naming    = 文件名风格（kebab-case / camelCase / PascalCase / snake_case / any）
#                dest      = 相对 root 的落点模板
#   dest 占位符：{slug} {folder} {root} {auto_number:4} {project_id}
#
#   kind: collection = 集合型分类：先有「实例编号文件夹」，文件放在实例里面。
#     instance.acquire: auto → 插件自动分配下一个编号，并建出 scaffold 骨架目录（不注册工具）
type: md
root: docs
root_allow: []

categories:
  guides:
    folder: guides
    keywords: [指南, 教程, guide, tutorial, howto, 手册]
    dest: "guides/{slug}.md"

  api:
    folder: api
    keywords: [接口, api, 接口文档, endpoint]
    dest: "api/{slug}.md"

  adr:
    folder: adr
    keywords: [决策, adr, decision, 取舍, 技术选型]
    dest: "adr/{auto_number:4}-{slug}.md"

  research:
    folder: research
    keywords: [调研, research, 竞品分析, 选型报告, spike, 可行性]
    dest: "research/{slug}.md"

  # PRD 单独一类：路径落在 docs/prd/，文件名保留 prd 前缀，
  # 这样路径子系统与内容规范（prd 的 match 里有关键词 prd）能对上——
  # 放在 project 集合型分类下会被要求先有 PRJ-xxxx 实例目录，永远走不到内容校验。
  prd:
    folder: prd
    keywords: [prd, 产品需求]
    dest: "prd/{slug}.md"

  # 项目级文档：设计稿 / 测试方案 / 规则说明这类东西，**本来就该直接放 docs/ 根**。
  # dest 渲染出来就是当前位置（{slug}.md），判定返回 pass——不移动、不打扰。
  # 没有这一条，docs/ 根下任何新文档都会被判「未分类」，或含「设计」时被要求先建 PRJ-xxxx。
  meta:
    folder: meta
    # 中英都要：英文项目里文档名多是 design / spec / rules / test-plan 这种写法
    keywords: [设计, 方案, 规范, 规则, 模板, 测试, 计划, 说明, design, spec, rules, template, test, plan, review, architecture]
    dest: "{slug}.md"

  project:
    folder: projects
    kind: collection
    # 关键词只放「项目」：集合型分类靠实例编号识别，不该靠「设计/需求/计划」这类
    # 到处都是的文档词去抢——抢了就把项目级文档逼成 need-allocate。
    keywords: [项目]
    instance:
      param: project_id
      pattern: "^PRJ-\\d{4}$"
      acquire: auto
      scaffold: [requirement/, design/, plan/]
    # 变体**不写 keywords**：变体只在「文件已在 projects/PRJ-xxxx/<变体>/ 下」时按目录名匹配（④）；
    # 一旦给它关键词，docs 根下的裸文件就会被它抢走，而那条路径又没有实例编号可用，
    # 结果只会是一句让人摸不着头脑的 need-allocate（本项目自己的 6 份 docs 全中过这个坑）。
    variants:
      requirement:
        dest: "projects/{project_id}/requirement/{slug}.md"
      design:
        dest: "projects/{project_id}/design/{slug}.md"
      plan:
        dest: "projects/{project_id}/plan/{slug}.md"
